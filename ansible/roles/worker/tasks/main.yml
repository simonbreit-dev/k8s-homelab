---
- name: Check whether worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_conf

- name: Join worker to Kubernetes cluster
  when: not worker_kubelet_conf.stat.exists
  block:

    - name: Deploy temporary kubeadm join configuration
      ansible.builtin.template:
        src: kubeadm-join.yml.j2
        dest: /etc/kubernetes/kubeadm-join.yml
        owner: root
        group: root
        mode: "0600"

    - name: Join Kubernetes cluster
      ansible.builtin.command:
        cmd: kubeadm join --config /etc/kubernetes/kubeadm-join.yml
        creates: /etc/kubernetes/kubelet.conf

  always:

    - name: Remove temporary kubeadm join configuration
      ansible.builtin.file:
        path: /etc/kubernetes/kubeadm-join.yml
        state: absent
