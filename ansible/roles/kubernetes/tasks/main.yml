---
- name: Verify IPv4 default route exists
  ansible.builtin.command:
    cmd: ip -4 route show default
  register: kubernetes_ipv4_default_route
  changed_when: false
  failed_when: kubernetes_ipv4_default_route.stdout | trim == ""

- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Configure Kubernetes sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1

- name: Read IPv4 forwarding state
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.ip_forward
  register: kubernetes_ipv4_forwarding
  changed_when: false

- name: Repair IPv4 forwarding drift
  ansible.builtin.command:
    cmd: sysctl -w net.ipv4.ip_forward=1
  when: kubernetes_ipv4_forwarding.stdout | trim != '1'
  changed_when: true

- name: Verify effective IPv4 forwarding
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.ip_forward
  register: kubernetes_ipv4_forwarding_effective
  changed_when: false
  failed_when: kubernetes_ipv4_forwarding_effective.stdout | trim != '1'

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Kubernetes APT repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/"
    suites:
      - "/"
    signed_by: /etc/apt/keyrings/kubernetes.asc
    state: present
  register: kubernetes_repository

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if kubernetes_repository.changed else apt_cache_valid_time }}"

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Ensure kubelet is enabled
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
