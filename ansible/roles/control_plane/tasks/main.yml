---
- name: Check whether Kubernetes control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: control_plane_admin_conf

- name: Inspect artifacts from incomplete control-plane bootstrap
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/kubernetes/pki/ca.crt
    - /etc/kubernetes/manifests/kube-apiserver.yaml
    - /var/lib/etcd/member
  register: control_plane_bootstrap_artifacts
  when: not control_plane_admin_conf.stat.exists

- name: Reject incomplete control-plane initialization
  ansible.builtin.assert:
    that:
      - control_plane_bootstrap_artifacts.results | selectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Control-plane artifacts exist without admin.conf. Inspect the failed kubeadm
      initialization; bootstrap will not reset or overwrite
      this partial cluster automatically.
  when: not control_plane_admin_conf.stat.exists

- name: Inspect an existing control-plane API
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - --request-timeout=15s
      - get
      - --raw=/readyz
  register: control_plane_existing_api
  changed_when: false
  failed_when: false
  when: control_plane_admin_conf.stat.exists

- name: Verify existing control plane is healthy before continuing
  ansible.builtin.assert:
    that:
      - control_plane_existing_api.rc == 0
    fail_msg: >-
      admin.conf exists but the control-plane API is not ready. Inspect kubelet,
      containerd and control-plane Pods. Bootstrap will not run
      another kubeadm init or automatically reset the cluster.
  when: control_plane_admin_conf.stat.exists

- name: Read installed kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: control_plane_kubeadm_version
  changed_when: false
  when: not control_plane_admin_conf.stat.exists

- name: Verify installed kubeadm version matches the pinned baseline
  ansible.builtin.assert:
    that:
      - control_plane_kubeadm_version.stdout | trim == 'v' + kubernetes_package_version.split('-')[0]
    fail_msg: Installed kubeadm does not match the configured bootstrap package version.
  when: not control_plane_admin_conf.stat.exists

- name: Deploy kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yml.j2
    dest: /etc/kubernetes/kubeadm-config.yml
    owner: root
    group: root
    mode: "0600"
  when: not control_plane_admin_conf.stat.exists

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yml
    creates: /etc/kubernetes/admin.conf
  when: not control_plane_admin_conf.stat.exists

- name: Create root kubeconfig directory
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install root kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Read admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: control_plane_admin_config
  no_log: true

- name: Decode admin kubeconfig
  ansible.builtin.set_fact:
    control_plane_source_config: "{{ control_plane_admin_config.content | b64decode | from_yaml }}"
  no_log: true

- name: Verify kubeadm kubeconfig structure
  ansible.builtin.assert:
    that:
      - control_plane_source_config.clusters | selectattr('name', 'equalto', 'kubernetes') | list | length == 1
    fail_msg: Expected the Kubernetes cluster in kubeadm admin.conf; inspect the configuration manually.
  no_log: true

- name: Store current cluster certificate authority
  ansible.builtin.set_fact:
    control_plane_ca_data: >-
      {{ (control_plane_source_config.clusters
          | selectattr('name', 'equalto', 'kubernetes')
          | map(attribute='cluster') | first)['certificate-authority-data'] }}
  no_log: true

- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write local kubeconfig with the Tailscale API endpoint
  ansible.builtin.template:
    src: kubeconfig.yml.j2
    dest: "{{ kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
  diff: false

- name: Verify local Kubernetes API access
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ kubeconfig_local_path }}"
      - --request-timeout=15s
      - get
      - --raw=/readyz
  delegate_to: localhost
  become: false
  changed_when: false
